<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPERO Studio • Mascot, Design &amp; Blueprint</title>
  <link rel="icon" type="image/png" sizes="256x256" href="./brand/opero-app-icon-256.png" />
  <link rel="apple-touch-icon" href="./brand/opero-app-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./studio/studio.css?v=7" />
  <link rel="stylesheet" href="./studio/editor.css?v=6" />
  <link rel="stylesheet" href="./studio/theme-docs.css?v=8" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="./brand/opero-app-icon-256.png" alt="" width="34" height="34" style="width:100%;height:100%;display:block;object-fit:contain;" />
      </div>
      <div>
        <h1>OPERO</h1>
      </div>
    </div>

    <nav class="segmented" role="tablist" aria-label="Studio Mode">
      <button id="modeLibBtn" class="seg-btn active" type="button"><span data-jigg-icon="cube" data-jigg-size="18"></span><span>Library</span></button>
      <button id="modeAnimBtn" class="seg-btn" type="button"><span data-jigg-icon="windmill" data-jigg-size="18"></span><span>Animate</span></button>
      <button id="modeDesignBtn" class="seg-btn" type="button"><span data-jigg-icon="palette" data-jigg-size="18"></span><span>Design System</span></button>
      <button id="modeDocsBtn" class="seg-btn" type="button"><span data-jigg-icon="book" data-jigg-size="18"></span><span>Docs &amp; Blueprint</span></button>
    </nav>

    <div class="toolbar">
      <button id="soundToggleBtn" class="btn active" type="button" title="Toggle cursor navigation sound" aria-pressed="true"><span data-jigg-icon="music-note-2" data-jigg-size="17"></span><span>Sound</span></button>
      <button id="newBlankBtn" class="btn" type="button"><span data-jigg-icon="feather" data-jigg-size="17"></span><span>New</span></button>
      <label class="btn" style="cursor:pointer;">
        <span data-jigg-icon="upload" data-jigg-size="17"></span><span>Import</span>
        <input id="importProjInput" type="file" accept=".json" style="display:none;" />
      </label>
    </div>
  </header>

  <!-- LIBRARY MODE -->
  <main id="libraryView" class="library-shell">
    <section class="card stage-sticky">
      <div id="libStageBox" class="stage-box bg-white">
        <span id="libStageMeta" class="stage-top-meta">03 · 2.0s</span>
        <div id="libBgDots" class="bg-dots">
          <button type="button" class="bg-dot active" data-bg="bg-white" style="background:#FFFFFF" title="White"></button>
          <button type="button" class="bg-dot" data-bg="bg-subtle" style="background:#F8FAFC" title="Subtle"></button>
          <button type="button" class="bg-dot" data-bg="bg-dark" style="background:#111827" title="Dark"></button>
          <button type="button" class="bg-dot" data-bg="bg-checker" style="background:linear-gradient(45deg,#E2E8F0 50%,#FFF 50%)" title="Transparent"></button>
        </div>
        <div id="libStageRender"></div>
      </div>

      <div class="panel-pad">
        <div class="meta-title">
          <h2 id="libName">Signature Thumbs Up</h2>
          <span id="libSlug" class="mono">03-thumbs-up</span>
        </div>
        <p id="libDesc" class="muted" style="margin:4px 0 12px;"></p>
        <div class="row-wrap" style="margin-bottom:8px;">
          <button id="libPlayBtn" class="btn primary" type="button"><span data-jigg-icon="toggle-left" data-jigg-size="17"></span><span>Pause</span></button>
          <select id="libSpeedSelect" class="btn" aria-label="Playback speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <button id="libRemixBtn" class="btn" type="button"><span data-jigg-icon="flash" data-jigg-size="17"></span><span>Remix</span></button>
        </div>
        <div class="row-wrap">
          <button id="libCopyBtn" class="btn" type="button"><span data-jigg-icon="saved" data-jigg-size="17"></span><span>Copy JSX</span></button>
          <a id="libOpenSvg" class="btn" href="#" target="_blank" rel="noopener"><span data-jigg-icon="feather" data-jigg-size="16"></span><span>SVG</span></a>
          <a id="libOpenPng" class="btn" href="#" target="_blank" rel="noopener"><span data-jigg-icon="camera" data-jigg-size="16"></span><span>PNG</span></a>
        </div>
      </div>

      <div class="panel-pad panel-sep">
        <div class="row-wrap" style="justify-content:space-between;">
          <span class="label-xs" style="display:inline-flex;align-items:center;gap:6px;"><span data-jigg-icon="palette" data-jigg-size="15"></span><span>Colors</span></span>
          <div class="row-wrap">
            <label style="font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;"><input id="libLinkColors" type="checkbox" /><span data-jigg-icon="magnet" data-jigg-size="14"></span><span>Link</span></label>
            <button id="libResetColors" class="btn ghost" type="button" style="min-height:24px;padding:0 6px;font-size:11px;"><span data-jigg-icon="broom" data-jigg-size="14"></span><span>Reset</span></button>
          </div>
        </div>
        <div class="color-row"><span>Cap</span><div id="libCapSwatches" class="row-wrap" style="flex:1;"></div><input id="libCapPicker" class="c-picker" type="color" value="#69BCFC" /></div>
        <div class="color-row"><span>Jacket</span><div id="libJacketSwatches" class="row-wrap" style="flex:1;"></div><input id="libJacketPicker" class="c-picker" type="color" value="#69BCFC" /></div>
      </div>

      <div class="panel-pad panel-sep">
        <span class="label-xs" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;"><span data-jigg-icon="emoji" data-jigg-size="15"></span><span>UX States</span></span>
        <div id="libSimChips" class="row-wrap"></div>
      </div>
    </section>

    <section>
      <div id="savedMotionsWrap" class="card panel-pad" style="margin-bottom:14px;">
        <span class="label-xs" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;"><span data-jigg-icon="bookmark" data-jigg-size="15"></span><span>Saved</span></span>
        <div id="savedMotionsBox" class="row-wrap"></div>
      </div>

      <div class="grid-top">
        <h2 style="margin:0;font-size:15px;display:inline-flex;align-items:center;gap:7px;"><span data-jigg-icon="cube" data-jigg-size="18"></span><span>Motions (20)</span></h2>
        <div class="search-wrap">
          <span class="search-ico" data-jigg-icon="flashlight" data-jigg-size="17"></span>
          <input id="libSearch" class="search has-ico" type="search" placeholder="Filter motions..." aria-label="Filter motions" />
        </div>
      </div>
      <div id="libGrid" class="motion-grid"></div>
    </section>
  </main>

  <!-- ANIMATE STUDIO MODE -->
  <section id="animateView" class="studio-shell hidden" aria-label="Custom Rig Animator">
    <div class="studio-stage-area">
      <div class="stage-hud-top">
        <span id="studioHudMeta" class="hud-pill">0% · 0.00s</span>
        <div class="segmented" role="group" aria-label="Canvas Drag Tool">
          <button id="toolSmartBtn" class="seg-btn active" type="button" data-tool="smart" title="Smart Drag (Shift to Rotate)"><span data-jigg-icon="magnet" data-jigg-size="16"></span><span>Smart</span></button>
          <button id="toolMoveBtn" class="seg-btn" type="button" data-tool="move" title="Move X/Y"><span data-jigg-icon="lasso" data-jigg-size="16"></span><span>Move</span></button>
          <button id="toolRotBtn" class="seg-btn" type="button" data-tool="rotate" title="Rotate"><span data-jigg-icon="windmill" data-jigg-size="16"></span><span>Rotate</span></button>
        </div>
        <div class="row-wrap">
          <button id="gizmoToggleBtn" class="btn active" type="button"><span data-jigg-icon="pin" data-jigg-size="17"></span><span>Pivots</span></button>
          <button id="onionToggleBtn" class="btn active" type="button"><span data-jigg-icon="glasses" data-jigg-size="17"></span><span>Onion</span></button>
          <div id="stBgDots" class="row-wrap" style="margin-left:4px;">
            <button type="button" class="bg-dot active" data-bg="bg-white" style="background:#FFFFFF" title="White"></button>
            <button type="button" class="bg-dot" data-bg="bg-subtle" style="background:#F4F9FF" title="Light Blue"></button>
            <button type="button" class="bg-dot" data-bg="bg-dark" style="background:#0F172A" title="Black"></button>
            <button type="button" class="bg-dot" data-bg="bg-checker" style="background:linear-gradient(45deg,#E2EAF2 50%,#FFF 50%)" title="Transparent"></button>
          </div>
        </div>
      </div>
      <div id="studioStageWrap" class="studio-canvas-wrap bg-white"></div>
    </div>

    <aside class="studio-inspector">
      <div class="row-wrap" style="justify-content:space-between;margin-bottom:8px;">
        <span class="label-xs" style="display:inline-flex;align-items:center;gap:6px;"><span data-jigg-icon="folder" data-jigg-size="15"></span><span>Project</span></span>
        <div class="row-wrap">
          <button id="saveMotionBtn" class="btn" type="button"><span data-jigg-icon="saved" data-jigg-size="16"></span><span>Save</span></button>
          <button id="openExportBtn" class="btn primary" type="button"><span data-jigg-icon="download" data-jigg-size="16"></span><span>Export</span></button>
        </div>
      </div>
      <input id="projNameInput" class="input-sm" type="text" value="Custom Pero Motion" aria-label="Motion name" />
      <div style="margin-top:8px;">
        <select id="stStarterSel" class="select-sm" aria-label="Load Starter Motion Preset">
          <option value="">Load preset...</option>
        </select>
      </div>

      <div class="ctrl-group">
        <span class="label-xs" style="display:inline-flex;align-items:center;gap:6px;"><span data-jigg-icon="bone" data-jigg-size="15"></span><span>Rig (11 Bones)</span></span>
        <div id="boneGrid" class="bone-grid"></div>
      </div>

      <div id="boneControls" class="ctrl-group"></div>

      <div class="ctrl-group">
        <span class="label-xs" style="display:inline-flex;align-items:center;gap:6px;"><span data-jigg-icon="palette" data-jigg-size="15"></span><span>Colors</span></span>
        <div class="color-row"><span>Cap</span><div id="stCapSwatches" class="row-wrap" style="flex:1;"></div><input id="stCapPicker" class="c-picker" type="color" value="#69BCFC" /></div>
        <div class="color-row"><span>Jacket</span><div id="stJacketSwatches" class="row-wrap" style="flex:1;"></div><input id="stJacketPicker" class="c-picker" type="color" value="#69BCFC" /></div>
      </div>
    </aside>

    <footer class="timeline-dock">
      <div class="tl-bar">
        <div class="row-wrap">
          <button id="stPlayBtn" class="btn primary" type="button"><span data-jigg-icon="send" data-jigg-size="17"></span><span>Play</span></button>
          <button id="stStopBtn" class="btn" type="button" title="Stop and Rewind"><span data-jigg-icon="anchor" data-jigg-size="17"></span></button>
          <button id="stPrevFrameBtn" class="btn" type="button" title="Step Back 5%"><span data-jigg-icon="feather" data-jigg-size="16"></span><span>-5%</span></button>
          <button id="stNextFrameBtn" class="btn" type="button" title="Step Forward 5%"><span data-jigg-icon="rocket" data-jigg-size="16"></span><span>+5%</span></button>
          <select id="stSpeedSel" class="select-sm" style="width:auto;" aria-label="Studio playback speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <button id="stLoopModeBtn" class="btn" type="button" title="Toggle Loop / Ping-Pong"><span data-jigg-icon="windmill" data-jigg-size="17"></span><span>Loop</span></button>
          <button id="addKfBtn" class="btn" type="button"><span data-jigg-icon="star" data-jigg-size="16"></span><span>KF</span></button>
          <button id="delKfBtn" class="btn" type="button"><span data-jigg-icon="eraser" data-jigg-size="16"></span><span>Del</span></button>
          <button id="mirrorLoopBtn" class="btn" type="button" title="Copy 0% pose to 100%"><span data-jigg-icon="handshake" data-jigg-size="16"></span><span>Mirror</span></button>
          <button id="followThroughBtn" class="btn" type="button" title="Auto-compute natural inertia"><span data-jigg-icon="flash" data-jigg-size="16"></span><span>Inertia</span></button>
        </div>
        <div class="row-wrap">
          <label class="mono" style="display:inline-flex;align-items:center;gap:6px;">Ease
            <select id="selEasing" class="select-sm" style="width:auto;height:28px;">
              <option value="easeInOut">Ease In-Out</option>
              <option value="cubic">Smooth Cubic</option>
              <option value="back">Anticipation</option>
              <option value="spring">Spring</option>
              <option value="linear">Linear</option>
              <option value="step">Step</option>
            </select>
          </label>
          <label class="mono" style="display:inline-flex;align-items:center;gap:5px;">Dur
            <input id="durRange" type="range" min="500" max="5000" step="100" value="1800" style="width:72px;accent-color:var(--accent);" />
            <span id="durLabel">1.8s</span>
          </label>
          <button id="undoBtn" class="btn" type="button" title="Undo"><span data-jigg-icon="broom" data-jigg-size="16"></span><span>Undo</span></button>
          <button id="redoBtn" class="btn" type="button" title="Redo"><span data-jigg-icon="flash" data-jigg-size="16"></span><span>Redo</span></button>
        </div>
      </div>

      <div id="tlTrack" class="tl-track-wrap">
        <div class="tl-ruler"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
        <div id="tlRail" class="tl-rail">
          <div id="tlDiamonds"></div>
          <div id="tlPlayhead" class="tl-playhead" style="left:0%;"></div>
        </div>
      </div>
    </footer>
  </section>

  <!-- DESIGN SYSTEM & PRIMARY THEME MODE -->
  <section id="designView" class="design-shell hidden" aria-label="OPERO Primary Theme &amp; Design System"></section>

  <!-- PRODUCT BLUEPRINT & DOCUMENTATION MODE -->
  <section id="docsView" class="docs-shell hidden" aria-label="OPERO Product Blueprint &amp; Technical Documentation"></section>

  <!-- EXPORT MODAL -->
  <div id="exportModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Export Custom Motion">
    <div class="modal-card">
      <div class="meta-title">
        <h2 style="margin:0;font-size:15px;display:inline-flex;align-items:center;gap:8px;"><span data-jigg-icon="send" data-jigg-size="18"></span><span>Export Motion</span></h2>
        <button id="closeExportBtn" class="btn ghost" type="button"><span data-jigg-icon="eraser" data-jigg-size="16"></span><span>Close</span></button>
      </div>
      <div class="row-wrap" style="margin:12px 0;gap:14px;">
        <label class="mono" style="display:inline-flex;align-items:center;gap:6px;">Size
          <select id="expSizeSel" class="select-sm" style="width:auto;height:28px;">
            <option value="256">256px</option>
            <option value="512" selected>512px</option>
          </select>
        </label>
        <label class="mono" style="display:inline-flex;align-items:center;gap:6px;">BG
          <select id="expBgSel" class="select-sm" style="width:auto;height:28px;">
            <option value="transparent" selected>Transparent</option>
            <option value="#FFFFFF">White</option>
            <option value="#0F172A">Black</option>
          </select>
        </label>
      </div>
      <div class="export-grid">
        <button id="expGifBtn" class="btn primary" type="button"><span data-jigg-icon="camera" data-jigg-size="18"></span><span>GIF</span></button>
        <button id="expSvgBtn" class="btn" type="button"><span data-jigg-icon="feather" data-jigg-size="18"></span><span>Animated SVG</span></button>
        <button id="expLottieBtn" class="btn" type="button"><span data-jigg-icon="rocket" data-jigg-size="18"></span><span>Lottie JSON</span></button>
        <button id="expSpriteBtn" class="btn" type="button"><span data-jigg-icon="map" data-jigg-size="18"></span><span>Sprite Sheet</span></button>
        <button id="expWebmBtn" class="btn" type="button"><span data-jigg-icon="megaphone" data-jigg-size="18"></span><span>WebM Video</span></button>
        <button id="expProjBtn" class="btn" type="button"><span data-jigg-icon="folder" data-jigg-size="18"></span><span>Project JSON</span></button>
      </div>
      <button id="expReactBtn" class="btn" type="button" style="width:100%;"><span data-jigg-icon="bot" data-jigg-size="18"></span><span>Copy React Snippet</span></button>
      <p id="exportStatus" class="mono" style="margin:10px 0 0;min-height:16px;"></p>
    </div>
  </div>
